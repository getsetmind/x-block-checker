name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-14
            executable: x-block-checker
            asset: x-block-checker-darwin-arm64
          - os: ubuntu-latest
            executable: x-block-checker
            asset: x-block-checker-linux-x64
          - os: windows-latest
            executable: x-block-checker.exe
            asset: x-block-checker-windows-x64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - run: bun install --frozen-lockfile
      - shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(bun -p 'require("./package.json").version')"
      - run: bun run check
      - shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          mkdir release
          mv "dist/$EXECUTABLE" "release/$ASSET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Releaseと成果物を作成
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - working-directory: release
        run: sha256sum x-block-checker-* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
